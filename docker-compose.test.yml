name: nibie-files-v3-tests
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nibie-v3-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nibie_ai
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nibie_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
