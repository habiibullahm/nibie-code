services:
  postgres:
    image: postgres:17
    container_name: nibie-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nibie_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nibie_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
