name: Preview App DB Migration

# Applies additive Drizzle migrations to the shared app database that Vercel Preview
# uses (same Supabase/Postgres as production today). Required so PR Previews can
# exercise new tables (e.g. action_runs) before merge.
#
# Not the PR Guard "Integration DB + RLS" job (local Docker only).
# Not Supabase GitHub "Preview" branching (skipped here; migrations live in drizzle/).
#
# Vercel must not run db:migrate in the build. Migrations stay additive + backward
# compatible so the production app keeps serving until the PR merges.

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - '.github/workflows/preview-app-db-migration.yml'
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Share the queue with Production DB Migration — never overlap or cancel mid-migrate.
concurrency:
  group: shared-app-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Preview app DB migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same POSTGRES_URL_NON_POOLING as production: Preview and Production Vercel
    # targets share NEXT_PUBLIC_SUPABASE_URL / DATABASE_URL today.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration connection
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$POSTGRES_URL_NON_POOLING" ]]; then
            echo "::error::Secret POSTGRES_URL_NON_POOLING is not set on the 'production' environment."
            echo "::error::Preview Vercel uses the shared app DB; this workflow cannot apply PR migrations without it."
            exit 1
          fi

          if [[ "$POSTGRES_URL_NON_POOLING" == *":6543"* ]]; then
            echo "::error::POSTGRES_URL_NON_POOLING points at a pooled port (6543). Use the direct or session-mode connection."
            exit 1
          fi

      - name: Probe database connection
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const url = new URL(process.env.DATABASE_URL);
            const kind = url.hostname.startsWith("db.") ? "direct" : url.hostname.includes("pooler.") ? "pooler" : "other";
            console.log(`host kind=${kind} port=${url.port || 5432}`);
            const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 15, onnotice: () => {} });
            try {
              await sql`select 1`;
              console.log("connection ok");
            } catch (error) {
              console.error(`::error::Database connection failed: code=${error.code ?? "none"} name=${error.name} syscall=${error.syscall ?? "none"}`);
              process.exitCode = 1;
            } finally {
              await sql.end({ timeout: 5 });
            }
          '

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: npm run db:migrate

      - name: Verify action_runs exists when journal includes 0019
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            import postgres from "postgres";
            const journalPath = "drizzle/meta/_journal.json";
            if (!existsSync(journalPath)) {
              console.log("no drizzle journal; skip table verify");
              process.exit(0);
            }
            const journal = JSON.parse(readFileSync(journalPath, "utf8"));
            const tags = (journal.entries || []).map((e) => e.tag);
            if (!tags.includes("0019_action_runs")) {
              console.log("journal has no 0019_action_runs; skip");
              process.exit(0);
            }
            const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 15, onnotice: () => {} });
            try {
              const rows = await sql`
                select 1 as ok
                from information_schema.tables
                where table_schema = 'public'
                  and table_name = 'action_runs'
                limit 1
              `;
              if (!rows.length) {
                console.error("::error::Migration claimed success but public.action_runs is missing");
                process.exitCode = 1;
              } else {
                console.log("public.action_runs present");
              }
            } finally {
              await sql.end({ timeout: 5 });
            }
          '
