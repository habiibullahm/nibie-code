name: Preview App DB Migration

# INTERIM: Preview and Production Vercel targets share one Supabase/Postgres today.
# Prefer an isolated Preview database. Until that exists, this job may apply only
# strictly additive Drizzle migrations (gated below) under the `production`
# environment — enable required reviewers on that environment as a second gate.
#
# Shared DB writes are NOT automatic on every PR synchronize. They require either:
#   - PR label `allow-shared-db-migrate` (explicit approval after reviewing SQL), or
#   - `workflow_dispatch` (manual run).
# Without that, the job refuses to migrate (and fails when drizzle SQL changed).
# Label presence is resolved via the Issues Labels API (not only the webhook
# payload), because synchronize events can omit labels that are already on the PR.
#
# Not the PR Guard "Integration DB + RLS" job (local Docker only).
# Not Supabase GitHub "Preview" branching (skipped here; migrations live in drizzle/).
# Vercel must not run db:migrate in the build.
#
# Long-term: remove PR writes to production; apply schema only via
# Production DB Migration on main once Preview has its own database.

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'scripts/check-preview-migrations-additive.mjs'
      - '.github/workflows/preview-app-db-migration.yml'
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read
  # Live label lookup on synchronize (event payload labels can be empty).
  pull-requests: read

# Share the queue with Production DB Migration — never overlap or cancel mid-migrate.
concurrency:
  group: shared-app-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Preview app DB migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds POSTGRES_URL_NON_POOLING. Require reviewers on this environment.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse non-additive PR migrations
        run: |
          git fetch --no-tags origin main 2>/dev/null || true
          node scripts/check-preview-migrations-additive.mjs

      - name: Decide whether to write to shared app DB
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Prefer API labels below; event payload is a fallback only.
          LABEL_CSV_EVENT: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main 2>/dev/null || true
          CHANGED="$(git diff --name-only origin/main...HEAD -- 'drizzle/*.sql' || true)"
          if [[ -z "${CHANGED//[$' \t\r\n']/}" ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_drizzle_sql_changes" >> "$GITHUB_OUTPUT"
            echo "No new/changed drizzle SQL vs origin/main; skip shared DB write."
            exit 0
          fi
          echo "Changed SQL vs origin/main:"
          printf '%s\n' "$CHANGED"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            echo "Explicit workflow_dispatch — shared DB migrate allowed."
            exit 0
          fi

          # pull_request synchronize payloads sometimes omit labels even when the
          # PR already has allow-shared-db-migrate (seen empty LABEL_CSV on 4c773d4).
          LABEL_CSV="${LABEL_CSV_EVENT:-}"
          if [[ -n "${PR_NUMBER:-}" ]]; then
            API_LABELS="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" --paginate --jq '.[].name' 2>/dev/null | paste -sd, - || true)"
            if [[ -n "${API_LABELS//[$' \t\r\n']/}" ]]; then
              LABEL_CSV="$API_LABELS"
              echo "Resolved PR labels via API: ${LABEL_CSV}"
            else
              echo "Label API returned empty; falling back to event payload: ${LABEL_CSV_EVENT:-<empty>}"
            fi
          fi

          if [[ ",${LABEL_CSV}," == *",allow-shared-db-migrate,"* ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "reason=pr_label" >> "$GITHUB_OUTPUT"
            echo "PR label allow-shared-db-migrate present — shared DB migrate allowed."
            exit 0
          fi
          echo "apply=false" >> "$GITHUB_OUTPUT"
          echo "reason=missing_label" >> "$GITHUB_OUTPUT"
          echo "::error::Shared app DB migrate refused without explicit approval."
          echo "::error::Review the drizzle SQL, then add label allow-shared-db-migrate (re-runs this workflow) or run workflow_dispatch."
          echo "::error::Do not rely on silent PR CI writes; Production environment required reviewers should also stay enabled."
          exit 1

      - name: Check migration connection
        if: steps.decide.outputs.apply == 'true'
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$POSTGRES_URL_NON_POOLING" ]]; then
            echo "::error::Secret POSTGRES_URL_NON_POOLING is not set on the 'production' environment."
            echo "::error::Preview Vercel uses the shared app DB; this workflow cannot apply PR migrations without it."
            exit 1
          fi

          if [[ "$POSTGRES_URL_NON_POOLING" == *":6543"* ]]; then
            echo "::error::POSTGRES_URL_NON_POOLING points at a pooled port (6543). Use the direct or session-mode connection."
            exit 1
          fi

      - name: Probe database connection
        if: steps.decide.outputs.apply == 'true'
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const url = new URL(process.env.DATABASE_URL);
            const kind = url.hostname.startsWith("db.") ? "direct" : url.hostname.includes("pooler.") ? "pooler" : "other";
            console.log(`host kind=${kind} port=${url.port || 5432}`);
            const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 15, onnotice: () => {} });
            try {
              await sql`select 1`;
              console.log("connection ok");
            } catch (error) {
              console.error(`::error::Database connection failed: code=${error.code ?? "none"} name=${error.name} syscall=${error.syscall ?? "none"}`);
              process.exitCode = 1;
            } finally {
              await sql.end({ timeout: 5 });
            }
          '

      - name: Apply migrations
        if: steps.decide.outputs.apply == 'true'
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: npm run db:migrate

      - name: Verify action_runs and server write RPCs when journal includes them
        if: steps.decide.outputs.apply == 'true'
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            import postgres from "postgres";
            const journalPath = "drizzle/meta/_journal.json";
            if (!existsSync(journalPath)) {
              console.log("no drizzle journal; skip table verify");
              process.exit(0);
            }
            const journal = JSON.parse(readFileSync(journalPath, "utf8"));
            const tags = (journal.entries || []).map((e) => e.tag);
            const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 15, onnotice: () => {} });
            try {
              if (tags.includes("0019_action_runs")) {
                const rows = await sql`
                  select 1 as ok
                  from information_schema.tables
                  where table_schema = ${"public"}
                    and table_name = ${"action_runs"}
                  limit 1
                `;
                if (!rows.length) {
                  console.error("::error::Migration claimed success but public.action_runs is missing");
                  process.exitCode = 1;
                } else {
                  console.log("public.action_runs present");
                }
              }
              if (tags.includes("0021_action_runs_server_writes")) {
                const fns = await sql`
                  select p.proname
                  from pg_proc p
                  join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = ${"public"}
                    and p.proname in (${"insert_action_run"}, ${"complete_action_run"})
                  order by p.proname
                `;
                const names = fns.map((r) => r.proname);
                if (!names.includes("insert_action_run") || !names.includes("complete_action_run")) {
                  console.error("::error::0021 claimed success but insert_action_run/complete_action_run missing");
                  process.exitCode = 1;
                } else {
                  console.log("action_runs server write RPCs present");
                }
              }
              if (tags.includes("0023_action_runs_service_role_writes")) {
                // Double-quoted JS strings: nested single quotes would break bash -e '...' .
                const insertSig = "public.insert_action_run(uuid, uuid, text, text, text, text, uuid, uuid, jsonb)";
                const completeSig = "public.complete_action_run(uuid, uuid, text, text, jsonb)";
                const grants = await sql`
                  select
                    has_function_privilege(${"authenticated"}, ${insertSig}, ${"execute"}) as auth_insert,
                    has_function_privilege(${"authenticated"}, ${completeSig}, ${"execute"}) as auth_complete,
                    has_function_privilege(${"service_role"}, ${insertSig}, ${"execute"}) as svc_insert,
                    has_function_privilege(${"service_role"}, ${completeSig}, ${"execute"}) as svc_complete
                `;
                const g = grants[0];
                if (g?.auth_insert || g?.auth_complete || !g?.svc_insert || !g?.svc_complete) {
                  console.error("::error::0023 claimed success but audit RPC grants are wrong (authenticated must lack execute; service_role must have it)");
                  process.exitCode = 1;
                } else {
                  console.log("action_runs audit RPCs are service_role-only");
                }
              }
            } finally {
              await sql.end({ timeout: 5 });
            }
          '
