name: AI Response Quality V2 Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/chat/**'
      - 'app/actions/chat.ts'
      - 'lib/chat/**'
      - 'lib/context/**'
      - 'lib/ai/**'
      - 'lib/preferences/**'
      - 'lib/actions/**'
      - 'lib/research/**'
      - 'lib/web/**'
      - 'lib/citations/**'
      - 'components/chat-workspace.tsx'
      - 'components/use-chat-stream.ts'
      - 'components/settings/**'
      - 'tests/quality/**'
      - 'tests/e2e/response-quality.spec.ts'
      - 'tests/e2e/chat-core.spec.ts'
      - 'tests/e2e/high-stream.spec.ts'
      - 'tests/e2e/default-model-inheritance.spec.ts'
      - 'tests/e2e/recall-stream.spec.ts'
      - 'tests/e2e/settings*.spec.ts'
      - 'tests/e2e/chat-settings.spec.ts'
      - 'tests/e2e/weekly-usage.spec.ts'
      - 'tests/e2e/user-stop-workspace.spec.ts'
      - 'tests/e2e/stop-diagnostics.ts'
      - 'tests/e2e/chat-recovery-offline.spec.ts'
      - 'tests/e2e/workbench-history.spec.ts'
      - 'tests/reliability-local/**'
      - 'scripts/reliability-local/**'
      - 'playwright.reliability-local.config.ts'
      - 'tests/fixtures/response-quality-v2.json'
      - 'scripts/response-quality-eval.mjs'
      - 'scripts/prepare-response-quality-eval.mjs'
      - 'package.json'
      - '.github/workflows/ai-quality-v2.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test human-rated actual-output scoring harness (synthetic arithmetic only)
        run: npm run test:quality:v2
      - name: Production build (no provider credentials)
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Full browser suite (credential-dependent skips remain acceptance blockers)
        run: npx playwright test --workers=2 --reporter=line,github
      - name: Preserve failed Stop diagnostics and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-reliability-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  local-auth:
    name: Chat reliability with isolated auth and database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare pinned local test images
        run: node scripts/reliability-local/pull-images.mjs
      - name: Real local auth, persistence and RLS with a simulated provider
        run: npm run test:chat:local -- --reporter=line,github
