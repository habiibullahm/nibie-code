name: AI Response Quality V2 Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/context/context-policy.ts'
      - 'lib/ai/**'
      - 'tests/quality/**'
      - 'tests/fixtures/response-quality-v2.json'
      - 'scripts/response-quality-eval.mjs'
      - 'package.json'
      - '.github/workflows/ai-quality-v2.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test human-rated actual-output scoring harness (synthetic arithmetic only)
        run: npm run test:quality:v2
      - name: Production build (no provider credentials)
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Mocked streaming, Stop, recovery, and model picker E2E
        run: npx playwright test tests/e2e/chat-core.spec.ts tests/e2e/high-stream.spec.ts --workers=2
