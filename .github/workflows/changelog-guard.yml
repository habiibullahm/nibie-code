name: Changelog Guard

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    # labeled/unlabeled re-run the check when the no-changelog label changes.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: User-facing changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require a CHANGELOG.md entry for user-facing changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: node scripts/check-changelog.mjs --base "$BASE_SHA"
