name: Production DB Migration

# Owns production schema migrations. Vercel builds the app only; it must not run db:migrate.
# Vercel Deployment Checks should require the "Production DB migration" check below before
# promoting a main deployment to production (see docs/releases/V1_RELEASE_CHECKLIST.md).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running migration, and never run two at once. Later pushes queue behind it.
concurrency:
  group: production-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Production DB migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds POSTGRES_URL_NON_POOLING. Add required reviewers on this environment for a manual gate.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration connection
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$POSTGRES_URL_NON_POOLING" ]]; then
            echo "::error::Secret POSTGRES_URL_NON_POOLING is not set on the 'production' environment."
            exit 1
          fi

          # Migrations need a session-level connection; a transaction pooler (port 6543) breaks them.
          if [[ "$POSTGRES_URL_NON_POOLING" == *":6543"* ]]; then
            echo "::error::POSTGRES_URL_NON_POOLING points at a pooled port (6543). Use the direct or session-mode connection."
            exit 1
          fi

      # drizzle-kit swallows connection errors ("exit code 1" with no reason), so probe first.
      # Prints only the host kind and the error code, never the connection string or hostname.
      - name: Probe database connection
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const url = new URL(process.env.DATABASE_URL);
            const kind = url.hostname.startsWith("db.") ? "direct" : url.hostname.includes("pooler.") ? "pooler" : "other";
            console.log(`host kind=${kind} port=${url.port || 5432}`);
            const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 15, onnotice: () => {} });
            try {
              await sql`select 1`;
              console.log("connection ok");
            } catch (error) {
              console.error(`::error::Database connection failed: code=${error.code ?? "none"} name=${error.name} syscall=${error.syscall ?? "none"}`);
              process.exitCode = 1;
            } finally {
              await sql.end({ timeout: 5 });
            }
          '

      - name: Apply migrations
        env:
          # drizzle.config.ts reads DATABASE_URL.
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: npm run db:migrate
