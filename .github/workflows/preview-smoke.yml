# Cost-bounded signed-in Preview smoke.
# Runs on ready_for_review / reopened (not on every push), or via workflow_dispatch.
# If made a required check on main: after new commits, a human must re-run
# (mark ready again / reopen / Actions → Run workflow) — intentional.
name: Preview Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: preview-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    name: Preview signed-in smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch: always same-repo branch selected in Actions UI.
    # pull_request: same-repo non-draft only — never expose secrets to fork code.
    # No pull_request_target.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify checkout SHA matches expected HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "${HEAD_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Exact SHA invariant failed: git HEAD=${HEAD_SHA} expected=${EXPECTED_SHA}"
            exit 1
          fi
          echo "Checkout SHA matches expected HEAD: ${HEAD_SHA}"

      - name: Run signed-in Preview smoke
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        # Resolves exact-HEAD Preview → READY → SHA match → Deployment Protection
        # → QA login → Fast chat → SSE → persistence/reload → cleanup.
        # Never set E2E_BASE_URL here; the harness sets it for the child only.
        run: npm run test:qa:preview
